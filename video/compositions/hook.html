<template>
  <style>
    #root {
      position: absolute;
      inset: 0;
      overflow: hidden;
      background: #eee6d3;
      font-family: "Inter", sans-serif;
      color: #12302e;
    }
    #hook-cv {
      position: absolute;
      left: 0;
      top: 0;
      width: 1920px;
      height: 1080px;
    }
    .hook-line {
      position: absolute;
      left: 0;
      width: 1920px;
      top: 96px;
      text-align: center;
      font-family: "Archivo Black", sans-serif;
      font-size: 100px;
      letter-spacing: -0.02em;
      line-height: 1.1;
    }
    .hook-line .w {
      display: inline-block;
      margin: 0 0.12em;
    }
    .hook-line .red {
      color: #c8102e;
    }
  </style>
  <div id="root" data-composition-id="hook" data-width="1920" data-height="1080">
    <canvas id="hook-cv" width="1920" height="1080"></canvas>
    <div id="hook-l1" class="clip hook-line" data-start="0.3" data-duration="2.5">Une voix.</div>
    <div id="hook-l2" class="clip hook-line" data-start="2.9" data-duration="2.5">Une langue : la <span><span class="red">derja</span>.</span></div>
    <div id="hook-l3" class="clip hook-line" data-start="5.5" data-duration="2.5">Hors de sa langue, elle s’arrête.</div>
  </div>
  <script>
    (function () {
      document.querySelectorAll("#root .hook-line").forEach((el) => {
        const nodes = Array.from(el.childNodes);
        el.innerHTML = "";
        nodes.forEach((n) => {
          if (n.nodeType === 3) {
            n.textContent.split(/\s+/).filter(Boolean).forEach((t) => {
              const s = document.createElement("span");
              s.className = "w";
              s.textContent = t;
              el.appendChild(s);
            });
          } else {
            n.classList.add("w");
            el.appendChild(n);
          }
        });
      });

      const TUNIS = [10.18, 36.8];
      const render = window.SawtiGlobe(document.getElementById("hook-cv"));
      const st = {
        lon0: 18, lat0: 24, R: 700, cx: 960, cy: 1090, alpha: 1,
        p1: 0, p2: 0, p3: 0, fade: 0, pu1: 0, pu2: 0,
      };
      function draw() {
        render({
          lon0: st.lon0, lat0: st.lat0, R: st.R, cx: st.cx, cy: st.cy, alpha: st.alpha,
          home: TUNIS, homeLabel: "Tunis",
          arcs: [
            { from: TUNIS, to: [2.35, 48.86], p: st.p1, stop: 0.55, fade: st.fade, lift: 0.22, stopLabel: "Frontière de la langue" },
            { from: TUNIS, to: [-73.57, 45.5], p: st.p2, stop: 0.16, fade: st.fade, lift: 0.3 },
            { from: TUNIS, to: [-17.44, 14.69], p: st.p3, stop: 0.42, fade: st.fade, lift: 0.22 },
          ],
          pulses: [{ at: TUNIS, t: st.pu1 }, { at: TUNIS, t: st.pu2 }],
        });
      }
      draw();

      const tl = gsap.timeline({ paused: true, onUpdate: draw });
      tl.fromTo(st, { lon0: 18 }, { lon0: 2, duration: 8, ease: "none", onUpdate: draw }, 0);
      tl.fromTo(st, { R: 660 }, { R: 760, duration: 7.3, ease: "power1.inOut" }, 0);
      tl.fromTo(st, { pu1: 0 }, { pu1: 1, duration: 1.2, ease: "power2.out" }, 0.5);
      tl.fromTo(st, { pu2: 0 }, { pu2: 1, duration: 1.2, ease: "power2.out" }, 1.4);
      tl.fromTo(st, { p1: 0 }, { p1: 0.55, duration: 1.3, ease: "power2.out" }, 3.1);
      tl.fromTo(st, { p3: 0 }, { p3: 0.42, duration: 1.2, ease: "power2.out" }, 3.3);
      tl.fromTo(st, { p2: 0 }, { p2: 0.16, duration: 1.0, ease: "power2.out" }, 3.45);
      tl.fromTo(st, { fade: 0 }, { fade: 1, duration: 0.6, ease: "power2.inOut" }, 4.6);
      tl.to(st, { R: 2600, cy: 1500, duration: 0.55, ease: "power3.in" }, 7.45);

      function wordsIn(sel, at) {
        tl.fromTo(sel + " .w", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.16, stagger: 0.07, ease: "power2.out" }, at);
      }
      function wordsOut(sel, at) {
        tl.to(sel + " .w", { opacity: 0, filter: "blur(6px)", duration: 0.18, stagger: 0.03, ease: "power2.in" }, at);
      }
      wordsIn("#hook-l1", 0.4);
      wordsOut("#hook-l1", 2.55);
      wordsIn("#hook-l2", 3.0);
      wordsOut("#hook-l2", 5.15);
      wordsIn("#hook-l3", 5.6);
      tl.to("#hook-l3 .w", { opacity: 0, duration: 0.2, ease: "power2.in" }, 7.5);
      window.__timelines["hook"] = tl;
    })();
  </script>
</template>

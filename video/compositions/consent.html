  <script>
    (function () {
      const g = document.getElementById("cs-guil");
      let d = "";
      for (let k = 0; k < 24; k++) {
        const R = 260 + k * 36;
        let p = "";
        for (let i = 0; i <= 360; i++) {
          const th = (i / 360) * Math.PI * 2;
          const r = R + 15 * Math.sin(10 * th + k * 0.45);
          p += (i ? "L" : "M") + (420 + r * Math.cos(th)).toFixed(1) + " " + (560 + r * Math.sin(th) * 0.8).toFixed(1);
        }
        d += p;
      }
      g.innerHTML = '<path d="' + d + '" fill="none" stroke="#12302e" stroke-opacity="0.07" stroke-width="1.4"/>';

      // image px -> window px: scale 840/680, plus 52 px bar
      const S = 840 / 680;
      const BTN = { x: 133 * S, y: 52 + 408 * S };
      const VOIX = { x: 260 * S, y: 52 + 89 * S };
      const OFF = { x: 900, y: 980 };

      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#cs-card", { rotationY: -100, x: -200, opacity: 0 }, { rotationY: 6, x: 0, opacity: 1, duration: 1.1, ease: "expo.out" }, 0.1);
      tl.fromTo("#cs-ttl", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.25, ease: "power2.out" }, 0.8);
      tl.fromTo("#cs-sub", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.out" }, 1.3);
      tl.to(["#cs-ttl", "#cs-sub"], { opacity: 0, filter: "blur(6px)", duration: 0.2, ease: "power2.in" }, 3.6);
      tl.to("#cs-card", { rotationY: 0, duration: 0.8, ease: "power2.inOut" }, 3.6);

      tl.fromTo("#cs-win", { x: 1100 }, { x: 0, duration: 0.7, ease: "expo.out" }, 3.85);
      tl.fromTo("#cs-cursor", { x: OFF.x, y: OFF.y }, { x: OFF.x, y: OFF.y, duration: 0.01 }, 3.85);

      function press(at) {
        tl.to("#cs-cursor", { scale: 0.85, duration: 0.08, ease: "power2.in", transformOrigin: "4px 3px" }, at);
        tl.to("#cs-cursor", { scale: 1, duration: 0.12, ease: "power2.out" }, at + 0.08);
        tl.fromTo("#cs-cover", { clipPath: "inset(0% 0 0 0)" }, { clipPath: "inset(100% 0 0 0)", duration: 0.45, ease: "power2.inOut", immediateRender: false }, at + 0.15);
      }
      function stamp(sel, at, rot) {
        tl.fromTo(sel, { scale: 1.7, rotation: rot - 8, opacity: 0 }, { scale: 1, rotation: rot, opacity: 1, duration: 0.18, ease: "power4.out" }, at);
        tl.fromTo("#cs-card", { y: 0 }, { y: 5, duration: 0.07, ease: "power2.out", yoyo: true, repeat: 1, immediateRender: false }, at + 0.16);
      }

      // round 1 : unknown voice
      tl.to("#cs-cursor", { x: BTN.x, y: BTN.y, duration: 0.8, ease: "power3.inOut" }, 4.6);
      press(5.5);
      stamp("#cs-s1", 6.3, -9);

      // round 2 : consented voice
      tl.set("#cs-cover", { clipPath: "inset(0% 0 0 0)" }, 8.0);
      tl.to("#cs-cursor", { x: VOIX.x, y: VOIX.y, duration: 0.5, ease: "power3.inOut" }, 7.8);
      tl.to("#cs-cursor", { scale: 0.85, duration: 0.08, yoyo: true, repeat: 1, transformOrigin: "4px 3px" }, 8.32);
      tl.to("#cs-cursor", { x: BTN.x, y: BTN.y, duration: 0.5, ease: "power3.inOut" }, 8.6);
      press(9.15);
      stamp("#cs-s2", 9.9, 5);

      // round 3 : licence revoked by the holder
      tl.fromTo("#cs-lic-strike", { width: 0 }, { width: 210, duration: 0.3, ease: "power2.inOut" }, 11.0);
      tl.fromTo("#cs-lic-note", { opacity: 0 }, { opacity: 1, duration: 0.25 }, 11.2);
      tl.set("#cs-cover", { clipPath: "inset(0% 0 0 0)" }, 11.6);
      tl.to("#cs-cursor", { x: BTN.x + 6, y: BTN.y + 4, duration: 0.3, ease: "power2.inOut" }, 11.7);
      press(12.15);
      stamp("#cs-s3", 12.9, -3);

      // punch in on each real decision panel, so it reads at video size
      [[6.2, 7.45], [9.8, 10.8], [12.8, null]].forEach(([a, b]) => {
        tl.to("#cs-win", { scale: 1.32, transformOrigin: "10% 76%", duration: 0.5, ease: "power2.inOut" }, a);
        if (b) tl.to("#cs-win", { scale: 1, duration: 0.4, ease: "power2.inOut" }, b);
      });
      tl.fromTo("#cs-end", { clipPath: "inset(0 0 0 100%)" }, { clipPath: "inset(0 0 0 0%)", duration: 0.5, ease: "power2.inOut" }, 15.2);
      tl.fromTo("#cs-endtxt .w", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.16, stagger: 0.1, ease: "power2.out" }, 15.6);
      tl.set("#cs-pp", { opacity: 0 }, 15.75);
      window.__timelines["consent"] = tl;
    })();
  </script>

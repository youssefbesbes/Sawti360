  <script>
    (function () {
      function split(el) {
        const nodes = Array.from(el.childNodes);
        el.innerHTML = "";
        nodes.forEach((n) => {
          if (n.nodeType === 3) {
            n.textContent.split(/\s+/).filter(Boolean).forEach((t) => {
              const s = document.createElement("span");
              s.className = "w";
              s.textContent = t;
              el.appendChild(s);
            });
          } else {
            n.classList.add("w");
            el.appendChild(n);
          }
        });
      }
      split(document.getElementById("cr-title"));
      split(document.getElementById("cr-line"));

      const waves = Array.from(document.querySelectorAll("#cr-stage .cr-wave"));
      const st = { phase: 0 };
      function draw() {
        waves.forEach((w, j) => {
          const box = w.ownerSVGElement.viewBox.baseVal;
          const W = box.width, H = box.height;
          let p = "";
          for (let x = 0; x <= W; x += 4) {
            const y = H / 2 + (H * 0.22) * (Math.sin(x * 0.09 + st.phase + j) * 0.6 + Math.sin(x * 0.03 - st.phase * 0.6) * 0.4);
            p += (x ? "L" : "M") + x + " " + y.toFixed(1);
          }
          w.setAttribute("d", p);
        });
      }
      draw();

      const tl = gsap.timeline({ paused: true });
      tl.fromTo(st, { phase: 0 }, { phase: 24, duration: 8, ease: "none", onUpdate: draw }, 0);
      tl.fromTo("#cr-title .w", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.16, stagger: 0.08, ease: "power2.out" }, 0.25);
      const rot = [18, 9, 0, -9, -18];
      const zz = [-120, -40, 60, -40, -120];
      [1, 2, 3, 4, 5].forEach((n, i) => {
        tl.fromTo("#cr-i" + n, { rotationY: rot[i] + 90, z: -1400, opacity: 0 }, { rotationY: rot[i], z: zz[i], opacity: 1, duration: 0.9, ease: "expo.out" }, 0.9 + i * 0.3);
      });
      tl.fromTo("#cr-line .w", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.16, stagger: 0.08, ease: "power2.out" }, 3.3);
      tl.to("#cr-stage", { scale: 2.6, opacity: 0, transformOrigin: "960px 540px", duration: 0.55, ease: "power3.in" }, 7.45);
      window.__timelines["createurs"] = tl;
    })();

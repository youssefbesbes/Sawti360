      <div class="mo-row" id="mo-r1"><i class="dot" style="background: #c8102e"></i><b>En derja seulement</b><span>la Tunisie</span></div>

  <script>
    (function () {
      const TUNIS = [10.18, 36.8];
      const RED = "200,16,46", GOLD = "196,136,0";
      const render = window.SawtiGlobe(document.getElementById("mo-cv"));
      const st = { lon0: 14, lat0: 22, R: 420, cx: 1310, cy: 560, tn: 0, fr: 0, ot: 0, pu: 0, dim: 1 };
      function draw() {
        render({
          lon0: st.lon0, lat0: st.lat0, R: st.R, cx: st.cx, cy: st.cy, dim: st.dim,
          tunisiaBig: true, home: TUNIS,
          layers: [
            { mask: 4 | 8 | 16, t: st.ot, color: GOLD, size: 1.6 },
            { mask: 2, t: st.fr, color: RED, size: 1.6 },
            { mask: 1, t: st.tn, color: RED, size: 2.4 },
          ],
          pulses: [{ at: TUNIS, t: st.pu }],
        });
      }
      draw();
      const tl = gsap.timeline({ paused: true });
      tl.fromTo(st, { lon0: 14 }, { lon0: -38, duration: 10, ease: "power1.inOut", onUpdate: draw }, 0);
      tl.fromTo(st, { R: 380 }, { R: 430, duration: 2.0, ease: "expo.out", onUpdate: draw }, 0);
      tl.fromTo(st, { dim: 1 }, { dim: 0.4, duration: 0.8, onUpdate: draw }, 0.6);
      // 1. derja only: Tunisia
      tl.fromTo("#mo-r1", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.5, ease: "expo.out" }, 0.4);
      tl.fromTo(st, { tn: 0 }, { tn: 1, duration: 0.2, onUpdate: draw }, 0.8);
      tl.fromTo(st, { pu: 0 }, { pu: 1, duration: 1.2, ease: "power2.out", onUpdate: draw }, 0.9);
      // 2. + French: the francophone world fills in, spreading from Tunis
      tl.fromTo("#mo-r2", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.5, ease: "expo.out" }, 2.8);
      tl.fromTo(st, { fr: 0 }, { fr: 0.75, duration: 1.8, ease: "power2.inOut", onUpdate: draw }, 3.0);
      // 3. + other languages, tomorrow
      tl.fromTo("#mo-r3", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.5, ease: "expo.out" }, 5.5);
      tl.fromTo(st, { ot: 0 }, { ot: 1, duration: 2.0, ease: "power2.inOut", onUpdate: draw }, 5.7);
      tl.fromTo("#mo-line", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.25, ease: "power2.out" }, 7.6);
      tl.fromTo("#mo-note", { opacity: 0 }, { opacity: 0.7, duration: 0.4 }, 3.4);
      tl.to(["#mo-col", "#mo-line", "#mo-note", "#mo-cv"], { opacity: 0, duration: 0.3, ease: "power2.in" }, 9.7);
      window.__timelines["monde"] = tl;
    })();

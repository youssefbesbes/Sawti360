<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="lib/gsap.min.js"></script>
    <style>
      :root {
        --paper: #eee6d3;
        --ink: #12302e;
        --red: #c8102e;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--paper);
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
        background: var(--paper);
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="117" data-width="1920" data-height="1080">
      <div id="hook" class="clip" data-composition-id="hook" data-composition-src="compositions/hook.html" data-start="0" data-duration="9" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="terrain" class="clip" data-composition-id="terrain" data-composition-src="compositions/terrain.html" data-start="9" data-duration="22" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="probleme" class="clip" data-composition-id="probleme" data-composition-src="compositions/probleme.html" data-start="31" data-duration="11" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="createurs" class="clip" data-composition-id="createurs" data-composition-src="compositions/createurs.html" data-start="42" data-duration="10" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="reveal" class="clip" data-composition-id="reveal" data-composition-src="compositions/reveal.html" data-start="52" data-duration="6" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="parcours" class="clip" data-composition-id="parcours" data-composition-src="compositions/parcours.html" data-start="58" data-duration="16" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="consent" class="clip" data-composition-id="consent" data-composition-src="compositions/consent.html" data-start="74" data-duration="19" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="passeport" class="clip" data-composition-id="passeport" data-composition-src="compositions/passeport.html" data-start="93" data-duration="8" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="ethique" class="clip" data-composition-id="ethique" data-composition-src="compositions/ethique.html" data-start="101" data-duration="9" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="fin" class="clip" data-composition-id="fin" data-composition-src="compositions/fin.html" data-start="110" data-duration="7" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
